# =============================================================================
# Wyze Outdoor Plug (WLPPO1)
# =============================================================================
# ESPHome firmware for the Wyze Outdoor dual-outlet smart plug. Reverse-
# engineered from scratch — there is no upstream package or component.
#
# Hardware (per outlet, internal):
#   - ESP32 (esp-wrover-kit-class)
#   - HLW8012 power monitor IC (one per dual-outlet unit, summed)
#   - Two GPIO-driven relays (independent control)
#   - Two LDR-fed status LEDs (one per relay)
#   - Push button on each socket face
#   - Status LED on top of unit
#   - LDR for daylight detection (one per dual-outlet unit)
#
# This package handles:
#   - Both relays with custom restore_mode logic (Off / On / Last / Opposite)
#   - HLW8012 power monitoring with calibration
#   - Daylight binary sensor from LDR readings
#   - Push-button toggle for each relay
#   - Daily-energy total tracker
#   - Optional remote syslog (UDP)
#
# Usage as an importable package:
#   substitutions:
#     display_name: "Wyze Outdoor 1 - Hay Barn"
#     tech_name: wyze-outdoor-1-hay-barn
#     current_res: "0.001"   # power calibration: higher = lower watt reading
#     voltage_div: "770"     # power calibration: lower = lower voltage reading
#   packages:
#     base: github://alexlmiller/esphome-projects/wyze-outdoor-plug/wyze-outdoor-plug.yaml@main
#
# Required substitutions:
#   display_name  — human-readable friendly name
#   tech_name     — hostname (lowercase, hyphen-separated, ≤31 chars)
#   current_res   — HLW8012 current resistor calibration (default 0.001)
#   voltage_div   — HLW8012 voltage divider calibration (default 770)
#
# Optional substitutions:
#   syslog_host   — UDP syslog target (set in wrapper to enable)
# =============================================================================

substitutions:
  display_name: "Wyze Outdoor"
  tech_name: wyze-outdoor
  current_res: "0.001"
  voltage_div: "770"
  syslog_host: "127.0.0.1"

esphome:
  name: ${tech_name}
  friendly_name: ${display_name}
  on_boot:
    priority: 600
    then:
      - delay: 2s  # Wait for components to initialize
      - lambda: |-
          ESP_LOGD("boot", "Starting custom restore mode logic");

          std::string restore_mode1 = id(relay1_restore_mode_select).current_option().str();
          std::string restore_mode2 = id(relay2_restore_mode_select).current_option().str();

          ESP_LOGD("boot", "Relay1 restore mode: %s", restore_mode1.c_str());
          ESP_LOGD("boot", "Relay2 restore mode: %s", restore_mode2.c_str());

          // Relay1 custom restore logic
          if (restore_mode1 == "Restore On") {
            ESP_LOGD("boot", "Setting Relay1 ON");
            id(relay1).turn_on();
          } else if (restore_mode1 == "Opposite Last State") {
            ESP_LOGD("boot", "Toggling Relay1 to opposite of last state");
            id(relay1).toggle();
          }
          // "Restore Off" and "Restore Last State" are handled by ESPHome's
          // built-in restore_mode

          // Relay2 custom restore logic
          if (restore_mode2 == "Restore On") {
            ESP_LOGD("boot", "Setting Relay2 ON");
            id(relay2).turn_on();
          } else if (restore_mode2 == "Opposite Last State") {
            ESP_LOGD("boot", "Toggling Relay2 to opposite of last state");
            id(relay2).toggle();
          }

esp32:
  board: esp-wrover-kit

logger:
  level: INFO
  logs:
    hlw8012: WARN  # Reduce noise from power sensor

# Time source — required by syslog when consumers add it
time:
  - platform: sntp
    id: sntp_time

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${display_name}_AP
    password: !secret wifi_fallback_pw
  power_save_mode: none
  fast_connect: true

captive_portal:

switch:
  - platform: gpio
    name: ${display_name} Relay1
    device_class: outlet
    pin:
      number: GPIO15
      inverted: false
    id: relay1
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - light.turn_on: relay1_led
    on_turn_off:
      - light.turn_off: relay1_led

  - platform: gpio
    name: ${display_name} Relay2
    device_class: outlet
    pin:
      number: GPIO32
      inverted: false
    id: relay2
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - light.turn_on: relay2_led
    on_turn_off:
      - light.turn_off: relay2_led

  - platform: restart
    name: ${display_name} Restart

select:
  - platform: template
    name: "${display_name} Relay1 Restore Mode"
    id: relay1_restore_mode_select
    options:
      - "Restore Off"
      - "Restore On"
      - "Restore Last State"
      - "Opposite Last State"
    initial_option: "Restore Off"
    optimistic: true
    restore_value: true
    set_action:
      - lambda: |-
          ESP_LOGD("select", "Relay1 restore mode changed to: %s", x.c_str());
          // Built-in restore_mode is overridden by our custom on_boot logic

  - platform: template
    name: "${display_name} Relay2 Restore Mode"
    id: relay2_restore_mode_select
    options:
      - "Restore Off"
      - "Restore On"
      - "Restore Last State"
      - "Opposite Last State"
    initial_option: "Restore Off"
    optimistic: true
    restore_value: true
    set_action:
      - lambda: |-
          ESP_LOGD("select", "Relay2 restore mode changed to: %s", x.c_str());

output:
  - platform: gpio
    pin: GPIO19
    inverted: true
    id: relay1_led_gpio
  - platform: gpio
    pin: GPIO16
    inverted: true
    id: relay2_led_gpio

light:
  - platform: binary
    name: "Relay1 LED"
    id: relay1_led
    internal: true
    output: relay1_led_gpio
  - platform: binary
    name: "Relay2 LED"
    id: relay2_led
    internal: true
    output: relay2_led_gpio

sensor:
  # Internal ADC reading for daylight detection
  - platform: adc
    pin: GPIO34
    id: ldr_voltage
    internal: true
    update_interval: 30s
    attenuation: 12db
    filters:
      - sliding_window_moving_average:
          window_size: 3
          send_every: 1
    on_value:
      - binary_sensor.template.publish:
          id: daylight_sensor
          state: !lambda "return x > 1.0;"

  # Power monitoring (HLW8012)
  - platform: hlw8012
    sel_pin:
      number: GPIO25
      inverted: true
    cf_pin: GPIO27
    cf1_pin: GPIO26
    current_resistor: ${current_res}
    voltage_divider: ${voltage_div}
    change_mode_every: 3
    update_interval: 3s
    current:
      name: "${display_name} Amps"
      device_class: current
      state_class: measurement
      unit_of_measurement: A
      accuracy_decimals: 2
      filters:
        - lambda: if (x < 0.01) return 0.0; else return x;
    voltage:
      name: "${display_name} Volts"
      device_class: voltage
      state_class: measurement
      unit_of_measurement: V
      accuracy_decimals: 1
      filters:
        - lambda: if (x < 80 || x > 300) return {}; else return x;
    power:
      name: "${display_name} Watts"
      id: power_sensor
      device_class: power
      state_class: measurement
      unit_of_measurement: W
      accuracy_decimals: 0
      filters:
        - calibrate_linear:
            - 0.0 -> 0.0
            - 134 -> 58
        - lambda: if (x < 0) return 0.0; else return x;

  # Daily energy tracking — resets at midnight
  - platform: total_daily_energy
    name: "${display_name} Daily Energy"
    power_id: power_sensor
    device_class: energy
    state_class: total_increasing
    unit_of_measurement: Wh
    accuracy_decimals: 0
    restore: false

text_sensor:
  - platform: template
    name: "${display_name} Relay1 Restore Mode Text"
    lambda: |-
      return id(relay1_restore_mode_select).current_option().str();
    update_interval: 60s
    icon: "mdi:restore"

  - platform: template
    name: "${display_name} Relay2 Restore Mode Text"
    lambda: |-
      return id(relay2_restore_mode_select).current_option().str();
    update_interval: 60s
    icon: "mdi:restore"

binary_sensor:
  # LDR reads ~0.14 V dark, ~3.15 V daylight with steep S-curve at dawn/dusk.
  # Threshold at 1.0 V (mid-transition). Smoothing prevents flicker.
  - platform: template
    name: "${display_name} Daylight"
    device_class: light
    id: daylight_sensor

  - platform: gpio
    internal: true
    pin:
      number: GPIO18
      mode:
        input: true
        pulldown: true
      inverted: true
    name: ${display_name} Button1
    filters:
      - delayed_on: 10ms  # Debounce
    on_press:
      - switch.toggle: relay1

  - platform: gpio
    internal: true
    pin:
      number: GPIO17
      mode:
        input: true
        pulldown: true
      inverted: true
    name: ${display_name} Button2
    filters:
      - delayed_on: 10ms  # Debounce
    on_press:
      - switch.toggle: relay2

status_led:
  pin:
    number: GPIO5
    inverted: true
