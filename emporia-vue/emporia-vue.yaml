# =============================================================================
# Emporia Vue (16-channel whole-home energy monitor) — base package
# =============================================================================
# Provides ESP32 boilerplate (esphome, esp32, framework, OTA, API, WiFi),
# I²C bus, RTTTL buzzer, status LED, and diagnostic sensors. Wraps the
# emporia-vue-local/esphome external component but does NOT declare the
# emporia_vue sensor itself — that lives in the wrapper because every
# install has different phases + CT clamps wired.
#
# This split is intentional: ESPHome's package merging would create two
# conflicting emporia_vue sensor instances if we declared one here and
# the wrapper added another. Keeping the sensor in the wrapper is the
# only way to avoid that.
#
# Usage as an importable package:
#   substitutions:
#     tech_name: emporia-vue-house
#     display_name: "Emporia Vue - House"
#   packages:
#     base: github://alexlmiller/esphome-projects/emporia-vue/emporia-vue.yaml@main
#
#   # Wrapper provides the emporia_vue sensor block. See README "Wrapper template".
#
# Required substitutions:
#   tech_name     — hostname (lowercase, hyphen-separated, ≤31 chars)
#   display_name  — human-readable friendly name
#
# Optional substitutions:
#   syslog_host   — UDP syslog target (override + add syslog block in wrapper)
#   timezone      — IANA TZ for the SNTP time component
# =============================================================================

substitutions:
  tech_name: emporia-vue
  display_name: "Emporia Vue"
  syslog_host: "127.0.0.1"
  timezone: "America/Denver"

esphome:
  name: ${tech_name}
  friendly_name: ${display_name}
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: "false"
      CONFIG_ESP32_DEFAULT_CPU_FREQ_240: "true"

logger:
  level: INFO
  baud_rate: 0   # disable UART logger (frees ESP for the I²C bus)
  logs:
    sensor: WARN
    emporia_vue: INFO

# Time source — required by syslog when consumers add it.
time:
  - platform: sntp
    id: my_time
    timezone: ${timezone}

# Persist energy totals more frequently than ESPHome's default (15 min)
# so a power outage doesn't lose more than a few hours of accumulated kWh.
preferences:
  flash_write_interval: 6h

ota:
  - platform: esphome
    password: !secret ota_password

api:
  encryption:
    key: !secret api_key
  services:
    # Built-in RTTTL service — useful for HA automations that beep on events
    - service: play_rtttl
      variables:
        song_str: string
      then:
        - rtttl.play:
            rtttl: !lambda 'return song_str;'

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true
  ap:
    ssid: ${display_name}_AP
    password: !secret wifi_fallback_pw

captive_portal:

web_server:
  port: 80
  version: 3

external_components:
  - source: github://emporia-vue-local/esphome@dev
    components:
      - emporia_vue
    refresh: 1d

# I²C bus — Emporia Vue's PCB exposes the energy-monitor IC over I²C.
# The wrapper's emporia_vue sensor must reference `i2c_id: i2c_a`.
i2c:
  sda: 21
  scl: 22
  scan: false
  frequency: 400kHz
  timeout: 10ms
  id: i2c_a

# RTTTL buzzer — Emporia Vue PCB has an onboard piezo
output:
  - platform: ledc
    pin: GPIO12
    id: buzzer
    frequency: 2000Hz
  - platform: gpio
    pin: GPIO27
    id: buzzer_gnd

rtttl:
  output: buzzer
  on_finished_playback:
    - logger.log: 'Song ended'

button:
  - platform: template
    name: "Two Beeps"
    icon: "mdi:bell"
    on_press:
      - rtttl.play: "two short:d=4,o=5,b=100:16e6,16e6"

  - platform: restart
    name: "Restart"
    icon: "mdi:restart"
    entity_category: diagnostic

light:
  - platform: status_led
    name: "Status LED"
    pin:
      number: 23
      inverted: false
    restore_mode: ALWAYS_ON
    entity_category: diagnostic

# =============================================================================
# Diagnostic sensors (everything except the emporia_vue sensor itself)
# =============================================================================
sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    mac_address:
      name: "MAC Address"
      entity_category: diagnostic
