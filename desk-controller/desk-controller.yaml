# =============================================================================
# Standing Desk Controller — RJ12-tethered ESPHome bridge for Maidesite-class
# (Jarvis-clone, DeskUp Pro, Rocka, etc.) electric standing desks.
# =============================================================================
# Builds on the protocol work of github.com/smarthomeguys/DeskUp-Pro-Controller-RJ12.
# Their UART encode/decode lambdas, idle timer, M1-M4 preset round-trip,
# height slider, and Default/Rocka command variants are preserved verbatim
# (with two patches: a string-comparison fix for the "Rocka" branch, and
# inch-native units instead of centimeters — see "Units" below).
#
# Hardware: ESP32-S3 Mini by default. M5Stack NanoC6 (ESP32-C6) also works —
# override `board` and `tx_pin`/`rx_pin` accordingly. Any board with a 5 V-
# tolerant UART pair on broken-out GPIOs will do.
#
# Powered from the desk's 5 V rail through the same RJ12 cable that carries
# UART, so no separate USB-C power once installed.
#
# Wiring (RJ12 6P6C, looking into the desk's controller jack):
#   pin 1  — n/c
#   pin 2  — GND        → ESP GND
#   pin 3  — desk TX    → ESP RX  (default GPIO12 on S3 Mini)
#   pin 4  — desk 5 V   → ESP 5 V
#   pin 5  — desk RX    → ESP TX  (default GPIO13 on S3 Mini)
#   pin 6  — n/c
# Wire colors are typically Brown/Red/Green/Yellow but verify with a multimeter.
#
# Units: this desk family's firmware reports and accepts heights as deci-inches
# (inches × 10) on the wire. The /10 (RX) and *10 (TX) at the UART boundary
# keeps every entity in HA expressed as inches without further conversion.
# If you connect this package to a metric-firmware desk, swap the /10 and *10
# for /25.4 and *25.4 (mm <-> inches).
#
# Usage as an importable package:
#   substitutions:
#     device_id: standing-desk-office
#     device_name: "Standing Desk"
#     desk_min_height: "25.2"     # measured at full-down, inches
#     desk_max_height: "50.8"     # measured at full-up, inches
#   packages:
#     base: github://alexlmiller/esphome-projects/desk-controller/desk-controller.yaml@main
#   api:
#     encryption:
#       key: !secret api_key
#   wifi:
#     ssid: !secret wifi_ssid
#     password: !secret wifi_password
#
# Companion Home Assistant assets (Lovelace dashboard + sit/stand history-stats
# package) live in ./ha-config/ alongside this file.
# =============================================================================

substitutions:
  # --- Device identity (override per device) ---
  device_id: standing-desk
  device_name: "Standing Desk"

  # --- Desk physical travel limits in inches ---
  # Measure your specific desk: lower it all the way and read the cm sensor
  # after first boot, then raise it all the way and read the same sensor.
  # Override per desk.
  desk_min_height: "25.2"
  desk_max_height: "50.8"

  # --- Hardware (override for different boards) ---
  board: esp32-s3-devkitc-1
  tx_pin: GPIO13            # ESP TX -> desk RX (RJ12 pin 5)
  rx_pin: GPIO12            # ESP RX <- desk TX (RJ12 pin 3)
  status_led_pin: GPIO21    # WS2812 RGB on the S3 Mini

esphome:
  name: ${device_id}
  friendly_name: ${device_name}
  project:
    name: alexlmiller.desk_controller
    version: "1.0.0"
  on_boot:
    priority: 200
    then:
      - script.execute: script_run_on_boot

esp32:
  board: ${board}
  framework:
    type: esp-idf

logger:
  level: INFO

ota:
  - platform: esphome
    password: !secret ota_password

api:
  encryption:
    key: !secret api_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${device_id}-ap
    password: !secret wifi_fallback_pw
  power_save_mode: none
  fast_connect: true

captive_portal:

web_server:
  port: 80

# --------------------------------------------------------------------------
# UART to the desk controller
# --------------------------------------------------------------------------
uart:
  - id: uart_bus
    tx_pin: ${tx_pin}
    rx_pin: ${rx_pin}
    baud_rate: 9600
    debug:
      direction: BOTH
      dummy_receiver: true
      after:
        delimiter: [0x7E]
      sequence:
        - lambda: |-
            if (direction == UART_DIRECTION_RX)
            {
              // Height comes back as a 16-bit big-endian deci-inch count
              // (inches × 10) in bytes[4..5]. Divide by 10 for inches.
              if (bytes.size() == 9)
              {
                if (bytes[0] == 0xF2 && bytes[1] == 0xF2 && bytes[2] == 0x01 && bytes[8] == 0x7E)
                {
                  double height_in = ((bytes[4] * 256) + bytes[5]) / 10.0;
                  id(number_deskHeight).publish_state(height_in);
                }
              }
              else if (bytes.size() == 8)
              {
                if (bytes[0] == 0xF2 && bytes[1] == 0xF2 && bytes[7] == 0x7E)
                {
                  uint8_t command = bytes[2];
                  double height_in = ((bytes[4] * 256) + bytes[5]) / 10.0;

                  // Mapping note: the sender uses 0x25/0x26 for setm3/setm4
                  // but the desk responds with 0x27/0x28 to confirm those
                  // slots' stored heights. Receiver maps response opcodes,
                  // not request opcodes, so the M1/M2 here correspond to
                  // 0x25/0x26 broadcast events from the desk on power-up
                  // (often buffer noise until you press "Set Mx" on each).
                  if(command == 0x25)
                    id(sensor_deskm1).publish_state(height_in);
                  else if(command == 0x26)
                    id(sensor_deskm2).publish_state(height_in);
                  else if(command == 0x27)
                    id(sensor_deskm3).publish_state(height_in);
                  else if(command == 0x28)
                    id(sensor_deskm4).publish_state(height_in);
                }
              }
            }

# --------------------------------------------------------------------------
# Onboard status LED (WS2812 — S3 Mini wires it to GPIO21)
#   dim green = WiFi connected, healthy
#   red       = WiFi disconnected
# Edge-triggered, so the LED.turn_on call only fires on state transitions.
# If your hardware has no WS2812 on the chosen pin, remove the `light:` block
# and the `interval_wifi_status_led` block below.
# --------------------------------------------------------------------------
light:
  - platform: esp32_rmt_led_strip
    id: status_rgb
    name: Status LED
    chipset: WS2812
    rgb_order: GRB
    pin: ${status_led_pin}
    num_leds: 1
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF
    entity_category: diagnostic

# --------------------------------------------------------------------------
# Internal state
# --------------------------------------------------------------------------
globals:
  - id: seconds_idle_counter
    type: long
    restore_value: no
    initial_value: "0"

# --------------------------------------------------------------------------
# Scripts — desk control state machine
# --------------------------------------------------------------------------
script:
  - id: script_run_on_boot
    mode: single
    then:
      - logger.log: "On boot — querying desk height"
      - uart.write:
          data: [0xf1, 0xf1, 0x07, 0x00, 0x07, 0x7e]

  - id: script_idle_timer_reset
    mode: single
    then:
      - lambda: |-
          id(seconds_idle_counter) = 0;

  - id: script_set_idle_timestamp
    parameters:
      seconds: long
    mode: single
    then:
      - lambda: |-
          int days = seconds / (24 * 3600);
          seconds = seconds % (24 * 3600);
          int hours = seconds / 3600;
          seconds = seconds % 3600;
          int minutes = seconds / 60;
          seconds = seconds % 60;

          std::string daystr = "";
          if (days) {
            daystr = to_string(days) + " days, ";
          }

          std::string value = (std::string)str_sprintf("%s%02d:%02d:%02d", daystr.c_str(), hours, minutes, seconds);
          id(sensor_desk_idle_timestamp).publish_state(value);

  - id: script_send_desk_command
    parameters:
      cmd: string
    mode: single
    then:
      - lambda: |-
          ESP_LOGD("custom", "Move desk command: %s", cmd.c_str());
      - if:
          condition:
            lambda: |-
              if (id(switch_send_wake_up_cmd).state && id(seconds_idle_counter) >= 4)
                return true;
              else
                return false;
          then:
            - logger.log: "Sending wake up desk command"
            - uart.write: [0xF1, 0xF1, 0x2B, 0x00, 0x2B, 0x7E]
            - delay: 100ms
      - uart.write:
          data: !lambda |-
            if (cmd == "nudgeup")
              return { 0xf1, 0xf1, 0x01, 0x00, 0x01, 0x7e };
            else if (cmd == "nudgedown")
              return { 0xf1, 0xf1, 0x02, 0x00, 0x02, 0x7e };
            else if (cmd == "m1")
              return { 0xf1, 0xf1, 0x05, 0x00, 0x05, 0x7e };
            else if (cmd == "m2")
              return { 0xf1, 0xf1, 0x06, 0x00, 0x06, 0x7e };
            else if (cmd == "m3")
              return { 0xF1, 0xF1, 0x27, 0x00, 0x27, 0x7E };
            else if (cmd == "m4")
              return { 0xf1, 0xf1, 0x28, 0x00, 0x28, 0x7e };
            else if (cmd == "setm1")
              return { 0xf1, 0xf1, 0x03, 0x00, 0x03, 0x7e };
            else if (cmd == "setm2")
              return { 0xf1, 0xf1, 0x04, 0x00, 0x04, 0x7e };
            else if (cmd == "setm3")
              return { 0xf1, 0xf1, 0x25, 0x00, 0x25, 0x7e };
            else if (cmd == "setm4")
              return { 0xf1, 0xf1, 0x26, 0x00, 0x26, 0x7e };
            else if (cmd == "stop")
              return { 0xf1, 0xf1, 0x2B, 0x00, 0x2B, 0x7e };
            else if (cmd == "getheight")
              return { 0xf1, 0xf1, 0x07, 0x00, 0x07, 0x7e };
            else
              return {};
      - logger.log: "Move desk command finished"

  - id: script_set_Desk_Height
    parameters:
      newHeight_in: float
    mode: single
    then:
      - logger.log: "Set desk height method started"
      - if:
          condition:
            lambda: |-
              if (id(switch_send_wake_up_cmd).state && id(seconds_idle_counter) >= 4)
                return true;
              else
                return false;
          then:
            - logger.log: "Sending wake up desk command"
            - uart.write: [0xF1, 0xF1, 0x2B, 0x00, 0x2B, 0x7E]
            - delay: 100ms
      - uart.write:
          data: !lambda |-
            // Desk wants the target as deci-inches (inches × 10) on the wire.
            // Variable name kept as height_mm to match upstream's packet
            // layout, but the value is actually deci-inches here.
            auto height_mm = static_cast<int>(newHeight_in * 10);

            if (id(number_deskHeight).has_state() && !std::isnan(id(number_deskHeight).state) &&
                id(number_deskOffsetGoUp).has_state() && !std::isnan(id(number_deskOffsetGoUp).state) &&
                id(number_deskOffsetGoDown).has_state() && !std::isnan(id(number_deskOffsetGoDown).state))
            {
              float current_height = id(number_deskHeight).state;
              int go_up_offset = id(number_deskOffsetGoUp).state;
              int go_down_offset = id(number_deskOffsetGoDown).state;

              // Offsets ride on the same wire scale as the height (deci-inches).
              if (newHeight_in > current_height) {
                height_mm = height_mm + go_up_offset;
              }
              else if (newHeight_in < current_height) {
                height_mm = height_mm - go_down_offset;
              }
            }

            // NOTE: deviates from upstream — upstream stored this as
            // `auto` (const char*), so `== "Rocka"` was a pointer comparison
            // that was always false, silently never reaching the Rocka
            // branch. Using std::string here gives a real value comparison.
            std::string deskControlCodeVariant = "Default";
            if (id(select_desk_control_code_variant).has_state())
            {
              deskControlCodeVariant = id(select_desk_control_code_variant).current_option();
              ESP_LOGD("custom", "Using desk control code variant: %s", deskControlCodeVariant.c_str());
            }

            if (deskControlCodeVariant == "Rocka")
            {
              unsigned char high_byte = height_mm >> 8;
              unsigned char low_byte = height_mm & 0xFF;
              unsigned char checksum = 0x1b + 2 + high_byte + low_byte;
              return { 0xf1, 0xf1, 0x1b, 0x02, high_byte, low_byte, checksum, 0x7e };
            }
            else
            {
              std::vector<uint8_t> bArr(8);
              bArr[0] = 0xF1;
              bArr[1] = 0xF1;
              bArr[2] = 0x1B;
              bArr[3] = 0x02;
              bArr[4] = static_cast<uint8_t>(height_mm / 256);
              bArr[5] = static_cast<uint8_t>(height_mm % 256);
              bArr[6] = static_cast<uint8_t>((bArr[2] + bArr[3] + bArr[4] + bArr[5]) % 256);
              bArr[7] = 0x7E;
              return bArr;
            }
      - logger.log: "Set desk height method finished"

  - id: script_set_Desk_Height_In_Percent
    parameters:
      heightPercentage: int
    mode: single
    then:
      - lambda: |-
          float minHeight = id(number_deskMinHeight).state;
          float maxHeight = id(number_deskMaxHeight).state;
          float heightDiff = maxHeight - minHeight;
          float heightInPercent = float(heightPercentage) / 100.0;
          float height = (heightDiff * heightInPercent) + minHeight;

          float value = height;
          ESP_LOGD("custom", "Setting height to: %f from %d percent.", value, heightPercentage);
          id(script_set_Desk_Height).execute(value);

  - id: script_update_deskheightpercent_sensor
    mode: single
    then:
      - lambda: |-
          float height = id(number_deskHeight).state;
          float minHeight = ${desk_min_height};
          float maxHeight = ${desk_max_height};

          if (id(number_deskMinHeight).has_state() && !std::isnan(id(number_deskMinHeight).state)) {
            minHeight = id(number_deskMinHeight).state;
          }

          if (id(number_deskMaxHeight).has_state() && !std::isnan(id(number_deskMaxHeight).state)) {
            maxHeight = id(number_deskMaxHeight).state;
          }

          float value = 100 * (height - minHeight) / (maxHeight - minHeight);
          ESP_LOGD("custom", "Updating sensor desk height percent to: %f, height is: %f", value, height);
          id(sensor_deskheightpercent).publish_state(value);

# --------------------------------------------------------------------------
# Sensors
# --------------------------------------------------------------------------
sensor:
  - platform: template
    name: "Height"
    id: sensor_deskheight
    unit_of_measurement: in
    accuracy_decimals: 1
    icon: mdi:human-male-height-variant
    update_interval: never

  - platform: template
    name: "Height Percent"
    id: sensor_deskheightpercent
    unit_of_measurement: "%"
    icon: mdi:human-male-height-variant
    update_interval: never

  - platform: template
    name: "M1 Height"
    id: sensor_deskm1
    unit_of_measurement: in
    accuracy_decimals: 1
    icon: mdi:numeric-1-circle-outline

  - platform: template
    name: "M2 Height"
    id: sensor_deskm2
    unit_of_measurement: in
    accuracy_decimals: 1
    icon: mdi:numeric-2-circle-outline

  - platform: template
    name: "M3 Height"
    id: sensor_deskm3
    unit_of_measurement: in
    accuracy_decimals: 1
    icon: mdi:numeric-3-circle-outline

  - platform: template
    name: "M4 Height"
    id: sensor_deskm4
    unit_of_measurement: in
    accuracy_decimals: 1
    icon: mdi:numeric-4-circle-outline

  - platform: template
    name: "Idle Time"
    id: sensor_desk_idle_time
    unit_of_measurement: s
    device_class: duration
    icon: mdi:progress-clock
    update_interval: never

  - platform: uptime
    name: Uptime
    update_interval: 60s

  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s

text_sensor:
  - platform: version
    name: ESPHome Version

  - platform: wifi_info
    ip_address:
      name: IP Address
    ssid:
      name: WiFi SSID

  - platform: template
    name: "Idle Timestamp"
    id: sensor_desk_idle_timestamp
    icon: mdi:progress-clock
    update_interval: never

  - platform: template
    name: "Status"
    id: sensor_desk_status
    lambda: |-
      static float last_value = 0.0;
      static bool initialized = false;

      if (id(number_deskHeight).has_state() && !std::isnan(id(number_deskHeight).state))
      {
        float current_value = id(number_deskHeight).state;

        if (!initialized) {
          last_value = current_value;
          initialized = true;
          return {"Idle"};
        }

        float delta = current_value - last_value;
        last_value = current_value;

        if (delta > 0.01) {
          return {"Raising"};
        } else if (delta < -0.01) {
          return {"Lowering"};
        } else {
          return {"Idle"};
        }
      }
      else
        return {"Initialising"};
    icon: mdi:help-network-outline
    update_interval: 1s

# --------------------------------------------------------------------------
# Buttons — preset jumps, set-this-as-preset, nudges, stop
# --------------------------------------------------------------------------
button:
  - platform: template
    name: "Reset Idle Timer"
    id: button_reset_idle_timer
    icon: mdi:progress-clock
    on_press:
      - script.execute: script_idle_timer_reset

  - platform: template
    name: "Nudge Up"
    id: button_nudgedeskup
    icon: mdi:arrow-up-bold-circle-outline
    on_press:
      - script.execute:
          id: script_send_desk_command
          cmd: nudgeup

  - platform: template
    name: "Nudge Down"
    id: button_nudgedeskdown
    icon: mdi:arrow-down-bold-circle-outline
    on_press:
      - script.execute:
          id: script_send_desk_command
          cmd: nudgedown

  - platform: template
    name: "M1"
    id: button_desk_m1
    icon: mdi:numeric-1-circle-outline
    on_press:
      - script.execute:
          id: script_send_desk_command
          cmd: m1

  - platform: template
    name: "M2"
    id: button_desk_m2
    icon: mdi:numeric-2-circle-outline
    on_press:
      - script.execute:
          id: script_send_desk_command
          cmd: m2

  - platform: template
    name: "M3"
    id: button_desk_m3
    icon: mdi:numeric-3-circle-outline
    on_press:
      - script.execute:
          id: script_send_desk_command
          cmd: m3

  - platform: template
    name: "M4"
    id: button_desk_m4
    icon: mdi:numeric-4-circle-outline
    on_press:
      - script.execute:
          id: script_send_desk_command
          cmd: m4

  - platform: template
    name: "Set M1"
    id: button_desk_set_m1
    icon: mdi:numeric-1-circle-outline
    entity_category: config
    on_press:
      - script.execute:
          id: script_send_desk_command
          cmd: setm1
      - lambda: |-
          float height = id(number_deskHeight).state;
          id(sensor_deskm1).publish_state(height);

  - platform: template
    name: "Set M2"
    id: button_desk_set_m2
    icon: mdi:numeric-2-circle-outline
    entity_category: config
    on_press:
      - script.execute:
          id: script_send_desk_command
          cmd: setm2
      - lambda: |-
          float height = id(number_deskHeight).state;
          id(sensor_deskm2).publish_state(height);

  - platform: template
    name: "Set M3"
    id: button_desk_set_m3
    icon: mdi:numeric-3-circle-outline
    entity_category: config
    on_press:
      - script.execute:
          id: script_send_desk_command
          cmd: setm3
      - lambda: |-
          float height = id(number_deskHeight).state;
          id(sensor_deskm3).publish_state(height);

  - platform: template
    name: "Set M4"
    id: button_desk_set_m4
    icon: mdi:numeric-4-circle-outline
    entity_category: config
    on_press:
      - script.execute:
          id: script_send_desk_command
          cmd: setm4
      - lambda: |-
          float height = id(number_deskHeight).state;
          id(sensor_deskm4).publish_state(height);

  - platform: template
    name: "Stop"
    id: button_desk_stop
    icon: mdi:stop-circle-outline
    on_press:
      - script.execute:
          id: script_send_desk_command
          cmd: stop

  - platform: restart
    name: "Restart"
    entity_category: diagnostic

# --------------------------------------------------------------------------
# Cover (proportional height slider)
# --------------------------------------------------------------------------
cover:
  - platform: template
    name: "Height Slider"
    id: cover_desk_control
    has_position: true
    assumed_state: true
    open_action:
      - script.execute:
          id: script_set_Desk_Height_In_Percent
          heightPercentage: 100
    close_action:
      - script.execute:
          id: script_set_Desk_Height_In_Percent
          heightPercentage: 0
    position_action:
      - lambda: |-
          int newHeightPercent = pos * 100;
          id(script_set_Desk_Height_In_Percent).execute(newHeightPercent);
    lambda: !lambda |-
      int currentHeightPercent = (int) id(sensor_deskheightpercent).state;
      if (currentHeightPercent == 100)
        return COVER_OPEN;
      else if (currentHeightPercent == 0)
        return COVER_CLOSED;
      else {
        return currentHeightPercent / 100.0;
      }

# --------------------------------------------------------------------------
# Numbers — height (slider), travel limits, calibration offsets
# --------------------------------------------------------------------------
number:
  - platform: template
    name: "Height"
    id: number_deskHeight
    min_value: ${desk_min_height}
    max_value: ${desk_max_height}
    step: 0.1
    unit_of_measurement: in
    mode: slider
    on_value:
      - lambda: |-
          id(sensor_deskheight).publish_state(x);
          id(script_update_deskheightpercent_sensor).execute();
          id(script_idle_timer_reset).execute();
    set_action:
      - lambda: |-
          float height = x;
          id(script_set_Desk_Height).execute(height);

  - platform: template
    name: "Min Height"
    id: number_deskMinHeight
    unit_of_measurement: in
    min_value: 24
    max_value: 52
    step: 0.1
    initial_value: ${desk_min_height}
    mode: box
    update_interval: never
    optimistic: true
    restore_value: true
    icon: mdi:desk
    entity_category: config
    on_value:
      - lambda: |
          id(number_deskHeight)->traits.set_min_value(x);
          id(script_update_deskheightpercent_sensor).execute();

  - platform: template
    name: "Max Height"
    id: number_deskMaxHeight
    unit_of_measurement: in
    min_value: 24
    max_value: 52
    step: 0.1
    initial_value: ${desk_max_height}
    mode: box
    update_interval: never
    optimistic: true
    restore_value: true
    icon: mdi:desk
    entity_category: config
    on_value:
      - lambda: |
          id(number_deskHeight)->traits.set_max_value(x);
          id(script_update_deskheightpercent_sensor).execute();

  - platform: template
    name: "Offset Up by"
    id: number_deskOffsetGoUp
    unit_of_measurement: "0.1in"
    min_value: 0
    max_value: 10
    step: 1
    initial_value: 0
    mode: box
    update_interval: never
    optimistic: true
    restore_value: true
    icon: mdi:desk
    entity_category: config

  - platform: template
    name: "Offset Down by"
    id: number_deskOffsetGoDown
    unit_of_measurement: "0.1in"
    min_value: 0
    max_value: 10
    step: 1
    initial_value: 0
    mode: box
    update_interval: never
    optimistic: true
    restore_value: true
    icon: mdi:desk
    entity_category: config

# --------------------------------------------------------------------------
# Wake-up command toggle (config) — re-issues a stop frame before each
# command if the desk has been idle 4+ s. Some controllers nap; turn on
# if commands stop working after periods of inactivity.
# --------------------------------------------------------------------------
switch:
  - platform: template
    name: "Send Wake Up Cmd"
    id: switch_send_wake_up_cmd
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: mdi:sleep
    entity_category: config

# --------------------------------------------------------------------------
# Protocol variant selector — Default works for most Maidesite/DeskUp Pro
# clones. Switch to Rocka if set-height commands don't move the desk
# despite nudge/preset working.
# --------------------------------------------------------------------------
select:
  - platform: template
    name: "Control Code Variant"
    id: select_desk_control_code_variant
    optimistic: true
    options:
      - Default
      - Rocka
    initial_option: Default
    restore_value: true
    entity_category: config

# --------------------------------------------------------------------------
# Periodic intervals
# --------------------------------------------------------------------------
interval:
  - interval: 1s
    id: interval_sensors
    then:
      - lambda: |-
          id(seconds_idle_counter) += 1;
          long seconds = id(seconds_idle_counter);
          id(sensor_desk_idle_time).publish_state(seconds);
          id(script_set_idle_timestamp).execute(seconds);

  # Status LED edge-triggered: dim green when WiFi connected, red when down.
  - interval: 5s
    id: interval_wifi_status_led
    then:
      - lambda: |-
          static int last_state = -1;  // -1 = uninitialized
          int connected = wifi::global_wifi_component->is_connected() ? 1 : 0;
          if (connected == last_state) return;
          auto call = id(status_rgb).turn_on();
          call.set_brightness(0.05);  // dim — visible but not distracting
          if (connected) {
            call.set_rgb(0.0, 1.0, 0.0);
          } else {
            call.set_rgb(1.0, 0.0, 0.0);
          }
          call.perform();
          last_state = connected;
