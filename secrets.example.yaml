# =============================================================================
# ESPHome Secrets Template
# =============================================================================
# Copy this file to `secrets.yaml` (in the same directory as the device YAML
# you're compiling) and fill in your own values.
#
# `secrets.yaml` is gitignored — never commit real values.
# =============================================================================

# Wi-Fi credentials
wifi_ssid: "YourSSID"
wifi_password: "YourWiFiPassword"

# Fallback / captive-portal AP credentials
wifi_fallback_pw: "YourFallbackPassword"

# OTA update password (set the same value on every device for fleet management)
ota_password: "YourOtaPassword"

# Home Assistant API encryption key (must be a real 32-byte base64 string
# for `esphome config` to accept it — the value below is a placeholder
# that validates but should never be used on a real device).
# Generate your own with: openssl rand -base64 32
api_key: "PhP48yM4r+oBsp0GebZbaWmpJ6UPjd4iVYBObX7u9fQ="

# Optional: remote syslog target (UDP)
syslog_host: "10.0.0.1"
